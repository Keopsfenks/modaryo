name: modaryo

services:
  postgres:
    image: postgres:18.7-alpine
    container_name: modaryo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: modaryo
      POSTGRES_PASSWORD: modaryo_dev
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - modaryo-pg-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modaryo -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.2.0-alpine
    container_name: modaryo-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - modaryo-valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.34.0
    container_name: modaryo-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  modaryo-pg-data:
  modaryo-valkey-data:
